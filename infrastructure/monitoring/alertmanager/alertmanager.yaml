# Explore Bharat Safar — Prometheus AlertManager Production Configuration
global:
  resolve_timeout: 5m
  slack_api_url: "https://hooks.slack.com/services/REPLACE/WITH/SLACK_WEBHOOK"

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-ops-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-ops-notifications'

receivers:
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: "REPLACE_WITH_PAGERDUTY_INTEGRATION_KEY"
        severity: 'critical'
        description: '{{ .CommonAnnotations.summary }}: {{ .CommonAnnotations.description }}'

  - name: 'slack-ops-notifications'
    slack_configs:
      - channel: '#ops-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}\n*Severity*: {{ .CommonLabels.severity }}\n*Tier*: {{ .CommonLabels.tier }}'
