# Default production values for explore-bharat-safar Helm Chart
global:
  environment: production
  domain: explorebharatsafar.in
  apiDomain: api.explorebharatsafar.in
  registry: registry.explorebharatsafar.in
  imagePullPolicy: IfNotPresent

# API Workload (Fastify API Gateway)
api:
  replicaCount: 6
  image:
    repository: registry.explorebharatsafar.in/ebs-api
    tag: 1.0.0
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    minAvailable: 2

# Web Workload (Next.js 14 SSR)
web:
  replicaCount: 4
  image:
    repository: registry.explorebharatsafar.in/ebs-web
    tag: 1.0.0
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    minAvailable: 2

# Async Worker (BullMQ Background Processors)
worker:
  replicaCount: 3
  image:
    repository: registry.explorebharatsafar.in/ebs-worker
    tag: 1.0.0
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "100"
  tls:
    - secretName: ebs-wildcard-tls
      hosts:
        - explorebharatsafar.in
        - api.explorebharatsafar.in
