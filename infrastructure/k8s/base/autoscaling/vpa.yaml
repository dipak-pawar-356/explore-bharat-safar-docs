apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ebs-api-vpa
  namespace: ebs-core
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ebs-api
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: api
        minAllowed:
          cpu: 250m
          memory: 256Mi
        maxAllowed:
          cpu: 4000m
          memory: 4096Mi
        controlledResources: ["cpu", "memory"]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ebs-web-vpa
  namespace: ebs-core
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ebs-web
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: web
        minAllowed:
          cpu: 250m
          memory: 256Mi
        maxAllowed:
          cpu: 4000m
          memory: 4096Mi
        controlledResources: ["cpu", "memory"]
