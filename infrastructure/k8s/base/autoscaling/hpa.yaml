apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ebs-api-hpa
  namespace: ebs-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ebs-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ebs-web-hpa
  namespace: ebs-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ebs-web
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
