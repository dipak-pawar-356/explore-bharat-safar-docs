apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebs-worker
  namespace: ebs-core
  labels:
    app.kubernetes.io/name: ebs-worker
    app.kubernetes.io/part-of: explore-bharat-safar
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ebs-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebs-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: explorebharatsafar/worker:latest
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
