apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebs-web
  namespace: ebs-core
  labels:
    app.kubernetes.io/name: ebs-web
    app.kubernetes.io/part-of: explore-bharat-safar
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ebs-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebs-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: web
          image: explorebharatsafar/web:latest
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ebs-web-svc
  namespace: ebs-core
spec:
  selector:
    app.kubernetes.io/name: ebs-web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
