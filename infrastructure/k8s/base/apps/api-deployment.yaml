apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebs-api
  namespace: ebs-core
  labels:
    app.kubernetes.io/name: ebs-api
    app.kubernetes.io/part-of: explore-bharat-safar
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ebs-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebs-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: explorebharatsafar/api:latest
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - secretRef:
                name: ebs-api-secrets
            - configMapRef:
                name: ebs-api-config
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ebs-api-svc
  namespace: ebs-core
spec:
  selector:
    app.kubernetes.io/name: ebs-api
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
