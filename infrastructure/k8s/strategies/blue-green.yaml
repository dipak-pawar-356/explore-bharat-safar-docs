# Explore Bharat Safar — Blue-Green Deployment Specification
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ebs-web-bluegreen
  namespace: ebs-production
  labels:
    app.kubernetes.io/name: ebs-web
    app.kubernetes.io/part-of: explore-bharat-safar
spec:
  replicas: 6
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ebs-web
  strategy:
    blueGreen:
      activeService: ebs-web-active
      previewService: ebs-web-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 300
      prePromotionAnalysis:
        templates:
          - templateName: ebs-web-smoke-verification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ebs-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: registry.explorebharatsafar.in/ebs-web:latest
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ebs-web-active
  namespace: ebs-production
spec:
  selector:
    app.kubernetes.io/name: ebs-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ebs-web-preview
  namespace: ebs-production
spec:
  selector:
    app.kubernetes.io/name: ebs-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
