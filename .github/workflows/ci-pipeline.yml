name: Explore Bharat Safar — Monorepo CI Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Lint, Type-Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate 1: Code Formatting Check (Prettier)
        run: pnpm format:check

      - name: Gate 2: Static Analysis & ESLint
        run: pnpm lint

      - name: Gate 3: Universal TypeScript Strict Check
        run: pnpm type-check

      - name: Gate 4: Unit Test Suites
        run: pnpm test
