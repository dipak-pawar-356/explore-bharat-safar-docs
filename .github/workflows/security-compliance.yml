# =============================================================================
# Explore Bharat Safar — Enterprise Security, Dependency Audit & License Check
# Reference: EBS-BLU-11-SECURITY Section 8 (Continuous Security Posture)
#
# Triggers: Daily at 02:00 UTC (scheduled), PRs to main, manual dispatch
# Purpose:  Three-layer security audit:
#           Audit 1 — pnpm Dependency Vulnerability Scan (high severity)
#           Audit 2 — License Compliance (permissive licenses only)
#           Audit 3 — Gitleaks Secret Scanner (prevent credential leakage)
# =============================================================================

name: Enterprise Security, Dependency Audit & License Compliance

on:
  # Run daily at 02:00 UTC to catch newly disclosed vulnerabilities
  schedule:
    - cron: '0 2 * * *'
  # Run on every PR to main for early vulnerability detection
  pull_request:
    branches: [main]
  # Allow manual triggering for ad-hoc security assessments
  workflow_dispatch:

permissions:
  # Read repository contents for scanning
  contents: read
  # Write security events to the Security tab (SARIF upload)
  security-events: write

jobs:
  security-audit:
    name: Dependency Vulnerability & License Audit
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository for scanning
      #         Full history needed for Gitleaks historical commit scanning
      # -----------------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Install pnpm BEFORE setup-node (required for cache: 'pnpm').
      #         NOTE: No 'version' key — pnpm/action-setup@v4 auto-reads
      #         the version from package.json "packageManager": "pnpm@12.6.0".
      # -----------------------------------------------------------------------
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # -----------------------------------------------------------------------
      # Step 3: Configure Node.js 20 LTS with pnpm store caching
      # -----------------------------------------------------------------------
      - name: Setup Node.js 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # -----------------------------------------------------------------------
      # Step 4: Install production dependencies only for vulnerability scan
      # -----------------------------------------------------------------------
      - name: Install Production Dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # Audit 1: pnpm Security Vulnerability Audit
      #          Fails on HIGH or CRITICAL severity advisories in prod deps.
      #          Run `pnpm audit --fix` locally to resolve known issues.
      # -----------------------------------------------------------------------
      - name: 'Audit 1: pnpm Security Audit (High+ Severity)'
        run: pnpm audit --audit-level=high

      # -----------------------------------------------------------------------
      # Audit 2: License Compliance Check
      #          Ensures only permissive licenses are used (MIT, Apache-2.0,
      #          BSD-*, ISC). Rejects GPL, AGPL, LGPL, and unknown licenses.
      # -----------------------------------------------------------------------
      - name: 'Audit 2: License Compliance Check (Permissive Only)'
        run: bash scripts/security/license-compliance-check.sh

      # -----------------------------------------------------------------------
      # Audit 3: Gitleaks Secret Scanner
      #          Scans for accidentally committed credentials, API keys,
      #          tokens, and other secrets in the repository history.
      # -----------------------------------------------------------------------
      - name: 'Audit 3: Gitleaks Secret Scanner'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
