name: Enterprise Security, Dependency Audit & License Compliance

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Dependency Vulnerability & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Production Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit 1: pnpm Security Audit
        run: pnpm audit --prod --audit-level=high

      - name: Audit 2: License Compliance Check (Permissive Only)
        run: bash scripts/security/license-compliance-check.sh

      - name: Audit 3: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
